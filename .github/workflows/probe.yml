name: Reader probe

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to probe (boarddocs, simbli, boardbook, site, legistar)"
        default: "boarddocs"
      n:
        description: "Districts to probe (largest first)"
        default: "3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u tools/probe.py ${{ github.event.inputs.platform }} ${{ github.event.inputs.n }}
