name: District Signals crawl

on:
  schedule:
    # Every day at 02:15 UTC (about 8:15 PM Central). Each run classifies up to 400 new districts,
    # reads agendas for up to 400 districts, and refreshes the money feeds. The morning Claude run
    # at 7:07 AM Central reads data/matches.json by raw URL.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Districts to classify / read this run"
        default: "400"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Classify, read agendas, pull money feeds
        run: python run.py all --limit ${{ github.event.inputs.limit || 400 }} --budget-min 140
      - name: Commit the feed
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data/platforms.json data/matches.json data/state.json data/report.json
          git diff --cached --quiet || git commit -m "crawl $(date -u +%F)"
          git push
